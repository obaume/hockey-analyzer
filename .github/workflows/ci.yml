name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.3.0
      # Only the lint group (ruff, at its locked version) -- the full dev
      # install would pull in PySide6 for nothing.
      - name: Lint
        run: uv run --locked --only-group lint ruff check --output-format=github .
      - name: Format check
        run: uv run --locked --only-group lint ruff format --check .

  test-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      # python-version overrides .python-version so the matrix still applies.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --locked
      - name: Test
        run: uv run --locked pytest

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Install
        run: uv sync --locked
      - name: Test
        run: uv run --locked pytest
