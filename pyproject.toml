[project]
name = "hockey-analyzer"
version = "0.1.0"
description = "Local, offline hockey game tagging and analytics"
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy>=2.0",
    "PySide6>=6.7",
    "matplotlib>=3.5",
    # GPL-3.0 -- see docs/adr/0009-hockey-rink-for-rink-rendering.md for
    # why that's an accepted trade-off here.
    "hockey-rink>=1.1.4",
    # Reads the league site's game PDF export -- see
    # docs/adr/0005-pdf-export-as-primary-league-import-source.md.
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff==0.16.8",
]

[project.scripts]
hockey-analyzer = "hockey_analyzer.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
