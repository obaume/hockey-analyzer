[project]
name = "hockey-analyzer"
version = "0.1.0"
description = "Local, offline hockey game tagging and analytics"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy>=2.0",
    "PySide6>=6.7",
    "matplotlib>=3.5",
    # GPL-3.0 -- see docs/adr/0009-hockey-rink-for-rink-rendering.md for
    # why that's an accepted trade-off here.
    "hockey-rink>=1.1.4",
    # Reads the league site's game PDF export -- see
    # docs/adr/0005-pdf-export-as-primary-league-import-source.md.
    "pypdf>=4.0",
    # Ships a static ffmpeg binary for clip export -- see
    # docs/adr/0010-bundled-ffmpeg-for-clip-encoding.md.
    "imageio-ffmpeg>=0.5",
]

[project.scripts]
hockey-analyzer = "hockey_analyzer.app:main"

[dependency-groups]
# Installed by default on `uv sync`.
dev = [
    { include-group = "lint" },
    "pytest>=8.0",
    "pytest-qt>=4.4",
]
# Its own group so CI's lint job can install ruff without PySide6.
lint = [
    "ruff==0.17.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
